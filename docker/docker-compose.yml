version: "3.8"

services:
  web:
    build: .
    container_name: devops-web
    ports:
      - "5000:5000"
    networks:
      - devops_network
    volumes:
      - ./app.py:/app/app.py

  nginx:
    image: nginx:latest
    container_name: devops-nginx
    ports:
      - "80:80"
    networks:
      - devops_network

networks:
  devops_network:
    driver: bridge
