name: CI/CD DevOps AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.txt

      - name: Probar importacion de Flask
        run: |
          python -m py_compile docker/app.py
          python -c "import sys; sys.path.append('docker'); from app import app; print('Aplicacion Flask importada correctamente')"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Obtener informacion de AWS
        run: |
          aws sts get-caller-identity

      - name: Comprimir aplicacion
        run: |
          zip -r app-devops.zip docker/ template.yaml *.py *.sh

      - name: Subir artefacto a S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="devops-bucket-$ACCOUNT_ID"
          aws s3 cp app-devops.zip s3://$BUCKET_NAME/deploy/app-devops.zip

      - name: Ejecutar comando remoto en EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=devops-ec2-cloudformation" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Instancia encontrada: $INSTANCE_ID"

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No se encontro una instancia EC2 en ejecucion. Se omite despliegue via SSM."
            exit 0
          fi

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy desde GitHub Actions" \
            --parameters '{"commands":["echo Deploy ejecutado desde GitHub Actions","date"]}' \
            --region us-east-1
